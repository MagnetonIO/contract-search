name: Daily contract email backup
on:
  schedule:
    # Primary delivery is Vercel Cron. These are morning-only fallbacks;
    # all triggers share one persisted daily idempotency record.
    - cron: '37 9 * * *'
      timezone: America/Chicago
    - cron: '17 10 * * *'
      timezone: America/Chicago
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contract-digest
  cancel-in-progress: false
jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --omit=dev
      - name: Send new contracts once per Chicago day
        env:
          DASHBOARD_STORAGE: blob
          BLOB_READ_WRITE_TOKEN: ${{ secrets.DASHBOARD_BLOB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/send-digest.mjs
