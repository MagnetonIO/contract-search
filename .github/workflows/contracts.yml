name: Weekday contract search

on:
  schedule:
    - cron: '7 8 * * 1-5'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke: $0.15 cap, daily: $2 cap, public: no paid actors'
        type: choice
        options: [smoke, daily, public]
        default: smoke

permissions:
  contents: write

concurrency:
  group: contract-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MODE: ${{ github.event_name == 'schedule' && 'daily' || inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: code
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test runner
        working-directory: code
        run: python -m unittest discover -s tests -v
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: runner-state
          path: durable-state
      - name: Collect with durable state
        working-directory: code
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ "$MODE" = smoke ]; then
            python runner.py --mode smoke --state /tmp/contract-smoke.sqlite3 --output output/latest
          else
            python runner.py --mode "$MODE" --state ../durable-state/seen.sqlite3 --output output/latest
          fi
      - name: Publish run summary
        if: always()
        working-directory: code
        run: |
          if [ -f output/latest/summary.md ]; then
            cat output/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload CSVs and run evidence
        id: reports
        if: always() && hashFiles('code/output/latest/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-${{ github.run_id }}
          path: code/output/latest/
          if-no-files-found: error
          retention-days: 90
      - name: Save dedup state and latest report
        if: always() && steps.reports.outcome == 'success' && env.MODE != 'smoke' && hashFiles('code/output/latest/summary.json') != ''
        working-directory: durable-state
        run: |
          test -f ../code/output/latest/summary.json
          mkdir -p latest
          cp ../code/output/latest/* latest/
          git config user.name 'contract-search runner'
          git config user.email 'contract-search@users.noreply.github.com'
          git add seen.sqlite3 latest
          if ! git diff --cached --quiet; then
            git commit -m "Persist contract search state for run $GITHUB_RUN_ID"
            git push origin HEAD:runner-state
          fi
